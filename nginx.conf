server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /essays {
      try_files /essays/index.html =404;
    }

    location = /start-before-you-are-ready.html {
      return 301 /essays/start-before-you-are-ready.html;
    }

    location = /why-i-started-coding-manually-again.html {
      return 301 /essays/why-i-started-coding-manually-again.html;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }

    # keep static assets cached lightly
    location ~* \.(css|js|ico)$ {
      expires 7d;
      add_header Cache-Control "public";
    }
  }
