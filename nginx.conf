server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /api/playground-access {
      proxy_pass https://nextnative.dev/api/playground-access;
      proxy_set_header Host nextnative.dev;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }

    # keep static assets cached lightly
    location ~* \.(css|js|ico)$ {
      expires 7d;
      add_header Cache-Control "public";
    }
  }
